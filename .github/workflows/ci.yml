name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: new advisories appear without code changes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Known vulnerabilities in runtime dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --all-extras --no-emit-project --format requirements-txt -o runtime.txt
          uvx pip-audit --requirement runtime.txt --disable-pip
      - name: Runtime licenses are permissive
        run: |
          uvx --with-requirements runtime.txt pip-licenses --format=csv --from=mixed --ignore-packages pip-licenses prettytable wcwidth > licenses.csv
          cat licenses.csv
          # copyleft licenses would conflict with distributing NetGuard under MIT: fail and review
          ! grep -E -i 'GPL|General Public License|Affero|SSPL|EUPL' licenses.csv

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle has no inline scripts (the dashboard CSP forbids them)
        run: |
          test -f ../src/netguard/web/static/index.html
          # every <script> tag must load a file (src=); inline code would be blocked by the CSP
          ! grep -oE '<script[^>]*>' ../src/netguard/web/static/index.html | grep -v 'src='
      - run: pnpm audit --prod

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      # The API tests skip without the web extra; in CI that would hide them.
      - name: Web extra installed
        run: uv run python -c "import fastapi, uvicorn"
      - run: uv run pytest --cov --cov-report=term --cov-fail-under=90
      - name: Core works without the web extra
        run: |
          uv sync --locked --no-dev
          uv run --no-sync netguard lab evaluate > /dev/null
          uv run --no-sync netguard serve 2>&1 | grep -q "pip install 'netguard\[web\]'"
      - name: Lab scorecard
        run: uv run --no-sync netguard lab evaluate >> "$GITHUB_STEP_SUMMARY"
