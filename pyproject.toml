[project]
name = "netguard"
version = "0.8.0"
description = "Network intrusion detection & traffic analyzer with explainable, measurable detections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Furkan AKKAYA", email = "107130259+furkan-akkaya@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = ["ids", "nids", "network-security", "pcap", "intrusion-detection", "blue-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "dpkt>=1.9.8",
]

[project.scripts]
netguard = "netguard.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "netguard[web]",  # the API tests need the web extra; plain `uv sync`/`uv run` keep it installed
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4"]
ignore = ["S101"]  # asserts are used for type narrowing

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
# Synthetic lab traffic uses seeded random.Random on purpose: reproducible, not secret.
"src/netguard/lab/**" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = ["dpkt", "dpkt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["netguard"]
branch = true
# Analysis jobs run in worker subprocesses (netguard.worker); measure them too.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
