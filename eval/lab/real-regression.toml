# Run by the lab bridge on 27 Oct 2026 (kit of 8a7f181). The bridge's control
# connections use TCP 8766 and 8767 between the VMs and are in these captures.
# live-early-01 is the live early-warning run (eval/lab/live_delay.py --pcap).
# exp13: the capture ran about 14 min while the queries took 40 s (the bridge
# paused to update a helper); after the queries it holds only control traffic (10863
# packets on 8766/8767) and 12 multicast packets (mDNS, IPv6). Its Zeek
# difference is a timeout parameter: Zeek splits an unanswered SYN attempt
# after tcp_attempt_delay (5 s), NetGuard keeps SYN retransmissions in one flow
# for its 30 s handshake timeout; with tcp_attempt_delay=30sec it is equal.

[[capture]]
name = "exp06-slow-scan"
sha256 = "ef05fabd6069ed66"
packets = 3985
decode_errors = 0
