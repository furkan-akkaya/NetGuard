[[capture]]
name = "benign-01"
sha256 = "f3c6a7f9ddc48642"
packets = 4245
decode_errors = 0
flows = 398
final_rules = []
states = { SF = 377, S0 = 20, REJ = 1 }
# NetGuard has one 60 s UDP idle timeout; Zeek closes DNS/mDNS sessions after
# 10 s. With Zeek's default, mDNS bursts 47 s apart are two Zeek flows and one
# NetGuard flow (two such cases here); with the same timeout the flows are equal.
zeek_args = ["dns_session_timeout=60sec"]

# Scans run by the lab bridge with the 8a7f181 kit (27 Oct 2026). Each of
