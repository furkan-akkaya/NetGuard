# Pinned results of NetGuard on the real lab captures (docs/EVALUATION.md § 6).
# eval/lab/real_regression.py re-analyses each capture and fails on any
# difference, so a code change that alters real-traffic results is noticed.
# The captures themselves stay out of git; only their hashes are pinned here.
#
# Updating a value is a decision, not a fix: write down why in EVALUATION.md.
# Values from commit "fix(flows): ... both endpoints reset" (27 Oct 2026).

[[capture]]
name = "exp01-syn-scan"
sha256 = "376d4b6c4d54af96" # prefix; the full hash is checked by ingest.py and the manifest
packets = 2009
decode_errors = 0
flows = 1001
final_rules = ["NG-SCAN-001", "NG-SCAN-002"]
states = { REJ = 999, RSTO = 1, S0 = 1 }
zeek_args = []

[[capture]]
name = "live-syn-01"
sha256 = "65533b5b4a7f2ecb"
packets = 2005
decode_errors = 0
flows = 1000
final_rules = ["NG-SCAN-001", "NG-SCAN-002"]
states = { REJ = 999, RSTO = 1 }
