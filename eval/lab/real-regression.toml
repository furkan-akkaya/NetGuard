zeek_args = []
# Design limit, not a bug: NetGuard does not reassemble IP fragments. nmap -f
# puts only ports and sequence number in the first 8-byte fragment, so the
# probe is not a TCP segment to NetGuard; each flow starts at the victim's
# reply (reversed direction, OTH). Zeek reassembles: 99 REJ + 1 RSTO + 1 S0.
# NG-FRAG-001 reports the fragmentation itself.
zeek_known_difference = { only_netguard = 100, only_zeek = 100, reason = "no IP fragment reassembly" }

